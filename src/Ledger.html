document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', async e=>{
  const file = e.target.files[0]; if(!file) return;
  if(!requireLoaded()){ e.target.value = ''; return; }
  if(!confirm('Import se Sheet ka current data replace ho jayega (pehle automatic backup banega). Aage badhna hai?')){ e.target.value = ''; return; }
  try{
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const sheet = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name]) : [];
  const usedImportIds = new Set();
  const importId = v => { let id = (typeof v==='string' || typeof v==='number') ? String(v) : ''; if(!SAFE_ID.test(id) || usedImportIds.has(id)) id = uid(); usedImportIds.add(id); return id; };
  const archFlag = v => (v==='1' || v===1) ? '1' : '';

  const walletsIn = sheet('Wallets');
  if(walletsIn.length) state.wallets = walletsIn.map(r=>({id:importId(r.ID), name:r.Wallet||r.wallet||'Wallet', openingBalance:Number(r.OpeningBalance ?? r.Balance ?? 0), archived:archFlag(r.Archived)}));
  const walletIdByName = name => (state.wallets.find(w=>w.name===name)||{}).id || null;

  const walletTxIn = sheet('Wallet_Entries');
  if(walletTxIn.length) state.walletTx = walletTxIn.map(r=>({id:importId(r.ID), walletId:walletIdByName(r.Wallet), date:String(r.Date), type:(r.Type==='In')?'credit':'debit', amount:Number(r.Amount||0), note:r.Note||'', transferId:r.TransferID?String(r.TransferID):null})).filter(t=>t.walletId);

  const peopleIn = sheet('People_Ledger');
  if(peopleIn.length || sheet('People').length){
    const names = Array.from(new Set(peopleIn.map(r=>r.Person)));
    state.people = sheet('People').filter(r=>r.Person).map(r=>({id:importId(r.ID), name:r.Person, archived:archFlag(r.Archived)}));
    names.forEach(n=>{ if(n && !state.people.find(p=>p.name===n)) state.people.push({id:uid(), name:n}); });
    const typeFromLabel = lbl => ({'You Gave':'given','They Repaid':'they_repaid','You Borrowed':'borrowed','You Repaid':'you_repaid','Given':'given','Received':'they_repaid'}[lbl] || 'given');
    state.peopleTx = peopleIn.map(r=>({id:importId(r.ID), personId:state.people.find(p=>p.name===r.Person).id, date:String(r.Date), type:typeFromLabel(r.Type), amount:Number(r.Amount||0), walletId:r.ViaWallet?walletIdByName(r.ViaWallet):null, note:r.Note||''}));
    state.activePerson = state.people[0]?.id || null;
  }

  const cardsIn = sheet('Credit_Card');
  if(cardsIn.length || sheet('Cards').length){
    const names = Array.from(new Set(cardsIn.map(r=>r.Card)));
    state.cards = sheet('Cards').filter(r=>r.Card).map(r=>({id:importId(r.ID), name:r.Card, archived:archFlag(r.Archived)}));
    names.forEach(n=>{ if(n && !state.cards.find(c=>c.name===n)) state.cards.push({id:uid(), name:n}); });
    state.cardTx = cardsIn.map(r=>({id:importId(r.ID), cardId:state.cards.find(c=>c.name===r.Card).id, type:r.Type||'withdraw', date:String(r.Date), amount:Number(r.Amount||0), walletId:r.ViaWallet?walletIdByName(r.ViaWallet):null, note:r.Note||''}));
    state.activeCard = state.cards[0]?.id || null;
  }

  const expensesIn = sheet('Expenses');
  if(expensesIn.length) state.expenses = expensesIn.map(r=>({id:importId(r.ID), date:String(r.Date), category:r.Category||'', amount:Number(r.Amount||0), walletId:r.PaidVia?walletIdByName(r.PaidVia):null, note:r.Note||''}));

  const dailyIn = sheet('Daily_Income');
  if(dailyIn.length) state.daily = dailyIn.map(r=>({id:importId(r.ID), date:String(r.Date), time:r.Time||'', category:r.Category||'', amount:Number(r.Amount||0), walletId:r.ReceivedVia?walletIdByName(r.ReceivedVia):null, note:r.Note||''}));

  const monthlyIn = sheet('Monthly_Summary');
  if(monthlyIn.length) state.monthly = monthlyIn.map(r=>({id:uid(), year:Number(r.Year), month:r.Month, incomeBase:Number(r.ManualIncome||0), expenseBase:Number(r.ManualExpense||0)}));

  sheet('Expense_Categories').forEach(r=>{ if(r.Category && !state.expenseCategories.includes(String(r.Category))) state.expenseCategories.push(String(r.Category)); });
  sheet('Daily_Categories').forEach(r=>{ if(r.Category && !state.dailyCategories.includes(String(r.Category))) state.dailyCategories.push(String(r.Category)); });
  state.expenses.forEach(e=>{ if(e.category && !state.expenseCategories.includes(e.category)) state.expenseCategories.push(e.category); });
  state.daily.forEach(d=>{ if(d.category && !state.dailyCategories.includes(d.category)) state.dailyCategories.push(d.category); });

  const importProblems = sanitizeAll(state); // drop rows with impossible dates / bad ids etc. instead of failing the whole import
  if(importProblems.length && !confirm(importProblems.length + ' row galat hain (jaise date/ID) — unhe chhod kar baaki import karein?\n\nPehli galti: ' + importProblems[0].tab + ' — ' + importProblems[0].why)){
    try{ await loadAll(); }catch(_){}
    e.target.value = ''; render(); return;
  }
  const saved = await persistAll();
  e.target.value = '';
  if(!saved){
    try{ await loadAll(); }catch(_){}
    render();
    alert('Import save nahi ho paya — Sheet ka purana data waisa hi hai (screen refresh kar di).');
    return;
  }
  render();
  alert('Excel file imported — data Google Sheet me save ho gaya. Purana backup Drive ke "Mazumder Ledger Backups" folder me hai.');
  }catch(err){
    console.error('Import failed', err);
    alert('Import fail ho gaya: ' + (err.message||err) + '\n\nFile sahi .xlsx honi chahiye (isi app se export ki hui, ya sahi sheet names ke saath).');
    e.target.value = '';
  }
});


/* ---------- Auto refresh across devices (Phase 3) ---------- */
let pollTimer = null, toastTimer = null;
function toast(msg){ const el = document.getElementById('toast'); if(!el) return; el.textContent = msg; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 3500); }
function editingAny(){ return !!(editingWalletTxId || editingWalletId || editingPersonTxId || editingCardTxId || editingExpenseId || editingDailyId); }
/** True if the user is typing / has a half-filled form: we never refresh over that. */
function formIsDirty(){
  if(editingAny()) return true;
  const ae = document.activeElement;
  if(ae && main.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return true;
  return [...main.querySelectorAll('.entry-form input')].some(i=>!i.classList.contains('date-native') && i.type!=='checkbox' && i.value !== i.defaultValue);
}
async function pollOnce(){
  if(document.hidden || !state.loaded || state.loading || isLocked()) return;
  if(state.readOnly){ await tryReconnect(); return; }
  if(retryQueue.length){ await flushQueue(); return; }
  if(pending.size) return;
  let v; try{ v = Number(await gsRun('getDataVersion')); }catch(e){ return; }
  if(!isFinite(v) || v === state.dataVersion) return;
  if(formIsDirty()) return; // try again next tick, never wipe a half-typed form
  try{ await loadAll({silent:true}); render(); toast('Doosre device se update aaya ✓'); }catch(e){ /* keep current screen, retry later */ }
}
function startPolling(){ clearInterval(pollTimer); pollTimer = setInterval(pollOnce, 45000); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollOnce(); });
window.addEventListener('online', ()=>{ if(state.readOnly) tryReconnect(); else flushQueue(); });
window.addEventListener('beforeunload', e=>{ if(retryQueue.length){ e.preventDefault(); e.returnValue = ''; } });
document.getElementById('retryBtn').addEventListener('click', ()=>flushQueue());
async function refreshNow(){
  if(state.readOnly){ const ok = await tryReconnect(); if(!ok) toast('Abhi bhi offline hai'); return ok; }
  if(retryQueue.length){
    await flushQueue();
    if(retryQueue.length){
      if(!confirm(retryQueue.length + ' unsaved entry hain — Refresh karne se wo chali jayengi. Phir bhi?')) return false;
      retryQueue.length = 0; unsaved.clear(); updatePending();
    }
  }
  await loadAll(); render(); return true;
}
function probeStorage(){
  let r = 'blocked';
  try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); r = 'available'; }catch(e){}
  state.storageProbe = r; console.log('localStorage probe in this view:', r); updateFoot();
}
function updateFoot(){ const el = document.getElementById('diagFoot'); if(el) el.textContent = 'Ledger ' + (state.version ? 'v'+state.version : '') + ' · ' + (IN_APPS_SCRIPT ? 'Sheet app' : 'PWA') + ' · offline storage in this view: ' + (state.storageProbe || '…'); }
main.addEventListener('click', async e=>{
  const name = e.target.dataset && e.target.dataset.delcat; if(!name) return;
  const key = e.target.closest('[data-catkey]').dataset.catkey;
  if(!confirm('"' + name + '" category list se hata dein? (purani entries waisi hi rahengi)')) return;
  const r = await remoteCall('deleteCategory', key, name);
  if(!r.ok) return;
  const arr = key==='mf_exp_categories' ? 'expenseCategories' : 'dailyCategories';
  state[arr] = state[arr].filter(c=>c.toLowerCase()!==name.toLowerCase()); render();
});


/* ============================ PWA layer (hosted index.html only) ============================ */
const VAULT_KEY = 'ledger.vault.v1', SNAP_KEY = 'ledger.snapshot.v1', LOCK_AFTER_MS = 15*60*1000;
const API_URL_RE = /^https:\/\/script\.google\.com\/(?:a\/macros\/[A-Za-z0-9.-]+|macros)\/s\/[A-Za-z0-9_-]+\/exec$/; // the token is ONLY ever sent to a Google Apps Script URL
const userError = msg => Object.assign(new Error(msg), {userMessage: msg});
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pin, salt){
  if(!(window.crypto && crypto.subtle)) throw userError('Secure connection (https) chahiye — crypto available nahi hai.');
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encJson(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))); return {iv:b64(iv), ct:b64(ct)}; }
async function decJson(key, box){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(box.iv)}, key, unb64(box.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
const vaultCfg = () => { try{ return JSON.parse(localStorage.getItem(VAULT_KEY) || 'null'); }catch(e){ return null; } };

/* ---- offline snapshot: last data, encrypted with the PIN-derived key, for READ-ONLY viewing when there is no internet ---- */
async function saveSnapshot(raw){
  if(IN_APPS_SCRIPT || !API.key) return;
  try{ const json = JSON.stringify(raw); if(json.length > 2500000) return; localStorage.setItem(SNAP_KEY, JSON.stringify(await encJson(API.key, {t:Date.now(), raw}))); }
  catch(e){ console.warn('snapshot skipped', e); }
}
async function loadSnapshot(){
  if(!API.key) return null;
  try{ const s = localStorage.getItem(SNAP_KEY); return s ? await decJson(API.key, JSON.parse(s)) : null; }catch(e){ return null; }
}
function showOfflineBanner(){
  const el = document.getElementById('offlineBanner'); if(!el) return;
  document.getElementById('offlineText').textContent = '📴 Offline — ' + new Date(state.snapshotAt).toLocaleString('en-IN') + ' tak ka data (sirf dekh sakte ho).';
  el.style.display = 'flex';
}
function hideOfflineBanner(){ const el = document.getElementById('offlineBanner'); if(el) el.style.display = 'none'; }
async function tryReconnect(){
  if(isLocked()) return false;
  try{ await loadAll({silent:true}); hideOfflineBanner(); render(); toast('Wapas online ✓ — ab save kar sakte ho'); return true; }catch(e){ return false; }
}
document.getElementById('reconnectBtn').addEventListener('click', async ()=>{ if(!(await tryReconnect())) toast('Abhi bhi offline hai'); });

/* ---- pairing / PIN lock ---- */
let unlockWaiters = [], lastActive = Date.now(), pinFails = 0, pinBlockedUntil = 0, idleTimer = null;
function ensureUnlocked(){
  if(IN_APPS_SCRIPT || API.token) return Promise.resolve();
  return new Promise(res=>{ unlockWaiters.push(res); showLockOverlay(); });
}
function onUnlocked(){
  const o = document.getElementById('lockOverlay'); if(o) o.remove();
  lastActive = Date.now(); pinFails = 0;
  document.getElementById('lockBtn').style.display = '';
  const w = unlockWaiters; unlockWaiters = []; w.forEach(f=>f());
  if(!w.length && state.loaded){ render(); pollOnce(); }
}
function lockApp(){
  if(IN_APPS_SCRIPT || isLocked()) return;
  API.token = ''; API.key = null;
  main.innerHTML = '';
  showLockOverlay();
}
function showLockOverlay(msg){
  let o = document.getElementById('lockOverlay');
  if(!o){ o = document.createElement('div'); o.id = 'lockOverlay'; document.body.appendChild(o); }
  const cfg = vaultCfg(), paired = !!cfg;
  o.innerHTML = paired ? `
    <form class="lock-card" id="unlockForm" autocomplete="off">
      <h2>🔒 Mazumder Ledger</h2><p>PIN daalo (ye device pehle se pair hai).</p>
      <div class="field"><label>PIN</label><input type="password" name="pin" inputmode="numeric" autocomplete="current-password" autofocus required></div>
      <div class="err" id="lockErr">${h(msg||'')}</div>
      <button class="btn" type="submit" style="width:100%;">Unlock</button>
      <button class="linkbtn" type="button" id="forgetBtn">Is device ko bhoolo (naya pairing)</button>
    </form>` : `
    <form class="lock-card" id="pairForm" autocomplete="off">
      <h2>Pair this device</h2><p>Sheet me: Ledger menu &rarr; <b>PWA API: create / rotate token</b>. Phir "Anyone" wali Web App deployment ka URL aur token yahan daalo. Token is device par PIN se encrypt ho kar rakha jata hai.</p>
      <div class="field"><label>Web App URL</label><input type="url" name="url" placeholder="https://script.google.com/macros/s/…/exec" required></div>
      <div class="field"><label>API token</label><input type="password" name="token" autocomplete="off" required></div>
      <div class="field"><label>Naya PIN (kam se kam 4)</label><input type="password" name="pin" inputmode="numeric" autocomplete="new-password" required></div>
      <div class="field"><label>PIN dobara</label><input type="password" name="pin2" inputmode="numeric" autocomplete="new-password" required></div>
      <div class="err" id="lockErr">${h(msg||'')}</div>
      <button class="btn" type="submit" style="width:100%;">Pair &amp; unlock</button>
    </form>`;
  const err = t => { const e = document.getElementById('lockErr'); if(e) e.textContent = t; };
  const f = o.querySelector('form');
  f.onsubmit = async ev=>{
    ev.preventDefault(); const fd = new FormData(f); const btn = f.querySelector('button[type="submit"]'); btn.disabled = true;
    try{
      if(paired){
        if(Date.now() < pinBlockedUntil) throw userError('Bahut galat PIN — ' + Math.ceil((pinBlockedUntil-Date.now())/1000) + ' second ruko.');
        await unlockDevice(String(fd.get('pin')||''));
      } else {
        await pairDevice(String(fd.get('url')||''), String(fd.get('token')||''), String(fd.get('pin')||''), String(fd.get('pin2')||''));
      }
    }catch(e){ err(e && e.userMessage || ('Error: ' + (e && e.message || e))); btn.disabled = false; }
  };
  const forget = document.getElementById('forgetBtn');
  if(forget) forget.onclick = ()=>{ if(confirm('Is device ka pairing aur offline copy hata dein? (Sheet ka data safe rahega)')){ localStorage.removeItem(VAULT_KEY); localStorage.removeItem(SNAP_KEY); showLockOverlay(); } };
}
async function pairDevice(url, token, pin, pin2){
  url = url.trim(); token = token.trim();
  if(!API_URL_RE.test(url)) throw userError('URL sahi nahi hai. Format: https://script.google.com/macros/s/…/exec (Sheet ka naam wali "Anyone" deployment ka URL).');
  if(token.length < 32) throw userError('Token chhota hai — poora token paste karo.');
  if(pin.length < 4) throw userError('PIN kam se kam 4 characters ka rakho.');
  if(pin !== pin2) throw userError('Dono PIN same nahi hain.');
  API.url = url; API.token = token; pairingNow = true;
  try{ await apiCall('getVersion', []); }
  catch(e){ API.token = ''; throw userError('Pair nahi ho paya: ' + (e && e.message || e)); }
  finally{ pairingNow = false; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pin, salt);
  localStorage.setItem(VAULT_KEY, JSON.stringify({v:1, url, salt:b64(salt), box:await encJson(key, {token})}));
  API.key = key; onUnlocked();
}
async function unlockDevice(pin){
  const cfg = vaultCfg(); if(!cfg) throw userError('Pairing nahi mili — dobara pair karo.');
  const key = await deriveKey(pin, unb64(cfg.salt));
  let token;
  try{ token = (await decJson(key, cfg.box)).token; }
  catch(e){ if(++pinFails >= 5){ pinBlockedUntil = Date.now() + 30000; pinFails = 0; } throw userError('PIN galat hai.'); }
  API.url = cfg.url; API.token = token; API.key = key; onUnlocked();
}
function checkIdle(){ if(!IN_APPS_SCRIPT && !isLocked() && Date.now() - lastActive > LOCK_AFTER_MS) lockApp(); }
function startIdleWatch(){
  if(IN_APPS_SCRIPT) return;
  const bump = ()=>{ lastActive = Date.now(); };
  ['pointerdown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev, bump, {passive:true}));
  document.addEventListener('mousemove', bump, {passive:true});
  clearInterval(idleTimer);
  idleTimer = setInterval(checkIdle, 15000);
  document.getElementById('lockBtn').addEventListener('click', lockApp);
}

/* ---- install prompt, service worker + update flow, deep links, desktop shortcuts ---- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall = e; const b = document.getElementById('installBtn'); if(b) b.style.display = ''; });
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; const b = document.getElementById('installBtn'); if(b) b.style.display = 'none'; toast('App install ho gaya ✓'); });
document.getElementById('installBtn').addEventListener('click', async ()=>{ if(!deferredInstall) return; deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(_){} deferredInstall = null; document.getElementById('installBtn').style.display = 'none'; });
function registerSW(){
  if(IN_APPS_SCRIPT || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller; // first install must NOT trigger a reload
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer = ()=>{ document.getElementById('updateBanner').style.display = 'flex'; document.getElementById('updateBtn').onclick = ()=>{ if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); }; };
    if(reg.waiting && navigator.serviceWorker.controller) offer();
    reg.addEventListener('updatefound', ()=>{ const nw = reg.installing; if(nw) nw.addEventListener('statechange', ()=>{ if(nw.state === 'installed' && navigator.serviceWorker.controller) offer(); }); });
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
  }).catch(e=>console.warn('Service worker registration failed', e));
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!hadController || reloading) return;
    if(retryQueue.length){ toast('Naya version tayar — unsaved entries save hone ke baad reload karo'); return; } // never reload over unsaved work
    reloading = true; location.reload();
  });
}
function openTabFromUrl(){
  const t = new URLSearchParams(location.search).get('tab'); // manifest shortcuts: ./?tab=daily
  const li = t && document.querySelector('.tab[data-tab="' + t.replace(/[^a-z]/g,'') + '"]');
  if(li) li.click();
}
document.addEventListener('keydown', e=>{ // desktop: Alt+1..7 switches tabs
  if(!e.altKey || e.ctrlKey || e.metaKey || !state.loaded) return;
  const m = /^Digit([1-7])$/.exec(e.code || ''); if(!m) return;
  const li = document.querySelectorAll('.tab')[Number(m[1]) - 1]; if(li){ li.click(); e.preventDefault(); }
});
if(!IN_APPS_SCRIPT){ startIdleWatch(); registerSW(); }

startApp();
</script>
